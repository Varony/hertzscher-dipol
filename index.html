<style>
/* Hertzscher Dipol – interaktive Simulation */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#070a14; --panel:#0e1424; --panel2:#131b2f; --line:#1e2942;
  --fg:#e9eefb; --dim:#94a3c4; --accent:#4fc3f7; --accent2:#7c5cff;
  --warm:#ff7043; --cool:#5b8cff; --mag:#40e0d0; --lamp:#ffd54f; --ok:#43d17a; --bad:#ff5a6e;
}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;overflow:hidden}
button{font-family:inherit}
#app{display:flex;flex-direction:column;height:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- Kopfleiste ---------- */
header{flex:0 0 auto;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0d1428,#0a0f1d)}
.brandrow{display:flex;align-items:center;gap:10px;padding:7px 12px 3px}
.brandrow h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px;white-space:nowrap}
.brandrow .sub{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);flex:0 0 auto}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 10px 8px;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}

<body>
<div id="app">
  <header>
    <div class="brandrow">
      <span class="spark"></span>
      <h1>Hertzscher Dipol</h1>
      <span class="sub">Senden · Empfangen · Polarisation</span>
    </div>
    <nav id="tabs"></nav>
  </header>
  <main id="main"></main>
</div>
<script>
/* =========================================================================
   Hertzscher Dipol – interaktive Simulation
   Teil 1: Kern (Mathematik, 3D-Projektion, Bedienelemente, Tab-System)
   ========================================================================= */
'use strict';

const TAU = Math.PI * 2;
const C0 = 299792458;            // Lichtgeschwindigkeit in m/s
const D2R = Math.PI / 180;
const HALF_FOV = 23 * D2R;                       // halber vertikaler Öffnungswinkel
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);

function num(x, d = 2) { return x.toFixed(d).replace('.', ','); }
function hzStr(f) {
  if (f >= 1e9) return num(f / 1e9, 2) + ' GHz';
  if (f >= 1e6) return num(f / 1e6, f / 1e6 < 10 ? 2 : 1) + ' MHz';
  if (f >= 1e3) return num(f / 1e3, 0) + ' kHz';
  return num(f, 0) + ' Hz';
}
function pct(x) { return num(clamp(x * 100, 0, 999), x * 100 < 10 ? 1 : 0) + ' %'; }

const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const $ = s => document.querySelector(s);

/* ================= 3D-Vektor-Mathematik ================= */
const v3 = {
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: a => Math.hypot(a[0], a[1], a[2]),
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
};

/* ================= Physik: Feld eines Hertz-Dipols =================
   Dipol entlang der y-Achse. Standardformeln des kurzen Dipols mit
   Nahfeld- (1/r^3), Induktions- (1/r^2) und Fernfeldanteil (1/r).
   k = 2*pi/lambda, t = Phasenwinkel (omega*t) in rad.                 */
function dipoleField(x, y, z, t, k) {
  let r = Math.hypot(x, y, z); if (r < 1e-3) r = 1e-3;
  const rho = Math.hypot(x, z);
  const cost = y / r;
  const sint = Math.min(1, rho / r);
  const u = t - k * r;
  const cu = Math.cos(u), su = Math.sin(u);
  const i1 = 1 / r, i2 = i1 * i1, i3 = i2 * i1;
  const Er = 2 * cost * (cu * i3 - k * su * i2);
  const Et = sint * (cu * (i3 - k * k * i1) - k * su * i2);
  const Bp = sint * (k * k * cu * i1 + k * su * i2);
  const rh = [x / r, y / r, z / r];
  const cosf = rho > 1e-9 ? x / rho : 1, sinf = rho > 1e-9 ? z / rho : 0;
  const th = [cost * cosf, -sint, cost * sinf];       // theta-Dach
  const phv = [-sinf, 0, cosf];                       // phi-Dach
  const E = [Er * rh[0] + Et * th[0], Er * rh[1] + Et * th[1], Er * rh[2] + Et * th[2]];
  const B = [Bp * phv[0], Bp * phv[1], Bp * phv[2]];
  return { E, B, Er, Et, Bp, r, cost, sint, th, ph: phv, rh };
}
/* Amplituden der Feldkomponenten (Quadratur der Terme) */
function ampTheta(r, sint, k) {
  const i1 = 1 / r, i2 = i1 * i1, i3 = i2 * i1;
  return Math.abs(sint) * Math.hypot(i3 - k * k * i1, k * i2);
}
function ampBphi(r, sint, k) {
  const i1 = 1 / r, i2 = i1 * i1;
  return Math.abs(sint) * Math.hypot(k * k * i1, k * i2);
}
function ampEr(r, cost, k) {
  const i1 = 1 / r, i2 = i1 * i1, i3 = i2 * i1;
  return Math.abs(2 * cost) * Math.hypot(i3, k * i2);
}
/* Phasendifferenz zwischen E_θ und B_φ in Grad (90° im Nahfeld, 0° im Fernfeld) */
function fieldPhaseDiff(r, k) {
  const i1 = 1 / r, i2 = i1 * i1, i3 = i2 * i1;
  const AE = i3 - k * k * i1, BE = -k * i2;
  const AB = k * k * i1, BB = k * i2;
  const pE = Math.atan2(-BE, AE), pB = Math.atan2(-BB, AB);
  let d = (pE - pB) * 180 / Math.PI;
  d = ((d % 180) + 180) % 180;          // Phasendifferenz modulo 180°
  if (d > 90) d = 180 - d;              // 90° = Quadratur (Nahfeld), 0° = in Phase (Fernfeld)
  return d;
}
/* Dominierender Term: 0 = 1/r³ (Nahfeld), 1 = 1/r², 2 = 1/r (Fernfeld) */
function termDominance(r, k) {
  const i1 = 1 / r, i2 = i1 * i1, i3 = i2 * i1;
  const t = [i3, k * i2, k * k * i1];
  let m = 0; for (let i = 1; i < 3; i++) if (t[i] > t[m]) m = i;
  return m;
}
/* Wie stark ist der Energiefluss "gleichgerichtet"?   0 % = pendelt (Nahfeld),
   ~80 % = strahlt nach außen (Fernfeld) */
function fluxRatio(r, sint, k) {
  const i1 = 1 / r, i2 = i1 * i1, i3 = i2 * i1;
  let sum = 0, sq = 0;
  const N = 36;
  for (let i = 0; i < N; i++) {
    const u = i / N * TAU;
    const Et = sint * ((i3 - k * k * i1) * Math.cos(u) - k * i2 * Math.sin(u));
    const Bp = sint * (k * k * i1 * Math.cos(u) + k * i2 * Math.sin(u));
    const s = Et * Bp;
    sum += s; sq += s * s;
  }
  const mean = sum / N, rms = Math.sqrt(sq / N);
  return rms > 1e-30 ? Math.abs(mean) / rms : 0;
}

/* ================= Anzeige-Grundformen (2D) ================= */
function sLine(c, a, b, color, w, dash) {
  c.save(); c.strokeStyle = color; c.lineWidth = w;
  c.lineCap = 'round';
  if (dash) c.setLineDash(dash);
  c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke(); c.restore();
}
function sArrow(c, a, b, color, w, head) {
  const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
  if (L < 1.2) { c.save(); c.fillStyle = color; c.beginPath(); c.arc(a.x, a.y, w * .9, 0, TAU); c.fill(); c.restore(); return; }
  const ux = dx / L, uy = dy / L;
  const hs = Math.min(head, L * 0.75);
  c.save(); c.strokeStyle = color; c.fillStyle = color; c.lineWidth = w; c.lineCap = 'round';
  c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x - ux * hs * .7, b.y - uy * hs * .7); c.stroke();
  c.beginPath();
  c.moveTo(b.x, b.y);
  c.lineTo(b.x - ux * hs - uy * hs * .45, b.y - uy * hs + ux * hs * .45);
  c.lineTo(b.x - ux * hs + uy * hs * .45, b.y - uy * hs - ux * hs * .45);
  c.closePath(); c.fill(); c.restore();
}
function sText(c, x, y, txt, color, size, align, baseline) {
  c.save(); c.fillStyle = color; c.font = (size || 11) + 'px -apple-system,system-ui,sans-serif';
  c.textAlign = align || 'center'; c.textBaseline = baseline || 'middle';
  c.fillText(txt, x, y); c.restore();
}
function sGlow(c, x, y, r, color, alpha) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(255,255,255,' + alpha + ')');
  g.addColorStop(0.25, color.replace('A', (alpha * 0.85).toFixed(3)));
  g.addColorStop(1, color.replace('A', '0'));
  c.save(); c.globalCompositeOperation = 'lighter';
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = g; c.fill(); c.restore();
}

/* ================= Tab-System ================= */
const mainEl = document.getElementById('main');
const tabsEl = document.getElementById('tabs');
const views = [];
let cur = null, now = 0;

function addView(id, title, build) {
  const sec = el('section', 'view');
  sec.id = 'view-' + id;
  const stage = el('div', 'stage');
  const canvas = el('canvas');
  stage.append(canvas);
  stage.append(el('div', 'badges'));
  const panel = el('div', 'panel');
  sec.append(stage, panel);
  mainEl.append(sec);

  const view = {
    id, title, sec, stage, canvas, panel,
    ctx: canvas.getContext('2d'),
    W: 1, H: 1,
    cam: { yaw: -0.72, pitch: 0.30, dist: 8, target: [0, 0, 0] },
    homeCam: { yaw: -0.72, pitch: 0.30, dist: 8 },
    sprites: [], badges: [], phase: 0, t: 0,
    begin() {
      const cam = this.cam, cp = Math.cos(cam.pitch);
      const e = [cam.target[0] + cam.dist * cp * Math.sin(cam.yaw),
                 cam.target[1] + cam.dist * Math.sin(cam.pitch),
                 cam.target[2] + cam.dist * cp * Math.cos(cam.yaw)];
      const f = v3.norm(v3.sub(cam.target, e));
      let r = v3.cross(f, [0, 1, 0]); if (v3.len(r) < 1e-6) r = [1, 0, 0]; r = v3.norm(r);
      const u = v3.cross(r, f);
      this._F = { e, f, r, u, fpx: (this.H * 0.5) / Math.tan(HALF_FOV) };
      this.sprites.length = 0;
    },
    proj(p) {
      const F = this._F, d = v3.sub(p, F.e), z = v3.dot(d, F.f);
      return { x: this.W * 0.5 + F.fpx * v3.dot(d, F.r) / z,
               y: this.H * 0.5 - F.fpx * v3.dot(d, F.u) / z, z };
    },
    push(z, fn) { this.sprites.push({ z, fn }); },
    flush() { this.sprites.sort((a, b) => b.z - a.z); for (const s of this.sprites) s.fn(); this.sprites.length = 0; },
    resetCam() { Object.assign(this.cam, this.homeCam); },
    /* Nötiger Kameraabstand, damit ein Radius "rad" in beiden Richtungen passt */
    needDist(rad) {
      const tanV = Math.tan(HALF_FOV) * 0.92;
      const tanH = tanV * (this.W / Math.max(1, this.H));
      return clamp(rad / Math.max(0.02, Math.min(tanV, tanH)), 1.2, 60);
    },
    fit(rad) { this.cam.dist = this.needDist(rad); },
    setBadges(list) {
      this.badges = list;
      const box = this.stage.querySelector('.badges');
      if (!box) return;
      const key = list.join('|');
      if (box._key === key) return;
      box._key = key;
      box.innerHTML = '';
      list.forEach(t => box.append(el('div', 'badge', t)));
    },
    addBadgeBox() {
      if (!this.stage.querySelector('.badges')) {
        const b = el('div', 'badges'); this.stage.append(b);
      }
    },
    resize() {
      const r = this.canvas.getBoundingClientRect();
      const W = r.width, H = r.height;
      if (W < 4 || H < 4) return;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const w = Math.round(W * dpr), h = Math.round(H * dpr);
      if (this.canvas.width !== w || this.canvas.height !== h) { this.canvas.width = w; this.canvas.height = h; }
      this.W = W; this.H = H;
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (this.onResize) this.onResize();
    }
  };

  /* Bedienung: Ziehen = drehen, zwei Finger = zoomen */
  const pts = new Map(); let pinch = 0, moved = 0;
  const cv = canvas;
  cv.addEventListener('pointerdown', e => {
    try { cv.setPointerCapture(e.pointerId); } catch (_) { }
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = 0;
  });
  cv.addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    if (pts.size === 1) {
      if (!(view.onDrag && view.onDrag(dx, dy))) {
        view.cam.yaw -= dx * 0.0065;
        view.cam.pitch = clamp(view.cam.pitch + dy * 0.006, -1.32, 1.42);
        if (view.onOrbit) view.onOrbit();
      }
    } else if (pts.size >= 2) {
      const a = [...pts.values()];
      const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
      if (pinch > 0) {
        view.cam.dist = clamp(view.cam.dist * (pinch / d), 1.2, 60);
        if (view.onZoom) view.onZoom();
      }
      pinch = d;
    }
  });
  const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = 0; };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    view.cam.dist = clamp(view.cam.dist * Math.exp(e.deltaY * 0.0012), 1.2, 60);
    if (view.onZoom) view.onZoom();
  }, { passive: false });
  cv.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

  views.push(view);
  const btn = el('button', 'tab', title);
  btn.onclick = () => showView(view);
  tabsEl.append(btn);
  view.btn = btn;

  build(view);
  return view;
}

function showView(v) {
  views.forEach(x => {
    const on = x === v;
    x.sec.classList.toggle('on', on);
    x.btn.classList.toggle('on', on);
  });
  cur = v;
  if (history.replaceState) history.replaceState(null, '', '#' + v.id);
  requestAnimationFrame(() => { v.resize(); if (v.onShow) v.onShow(); });
  window.scrollTo(0, 0);
}

/* ================= Bedienelemente ================= */
function grid(parent, title) {
  const g = el('div', 'grid');
  parent.append(g);
  if (title) g.append(el('h2', 'sec', title));

/* ================= Diagramme ================= */
function polarPlot(cv, o) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.clientWidth || 150, H = cv.clientHeight || 118;
  if (cv.width !== W * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
  else if (cv.height !== H * dpr) { cv.height = H * dpr; }
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.40;
  c.strokeStyle = '#1e2942'; c.lineWidth = 1;
  for (let i = 1; i <= 3; i++) { c.beginPath(); c.arc(cx, cy, R * i / 3, 0, TAU); c.stroke(); }
  for (let i = 0; i < 8; i++) {
    const a = i * TAU / 8;
    c.beginPath(); c.moveTo(cx + Math.cos(a) * R * 0.08, cy + Math.sin(a) * R * 0.08);
    c.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); c.stroke();
  }
  /* Kurve: fn(alpha) -> 0..1, alpha gemessen ab oben, im Uhrzeigersinn */
  c.beginPath();
  for (let i = 0; i <= 180; i++) {
    const a = i / 180 * TAU;
    const rr = clamp(o.fn(a), 0, 1.15) * R;
    const x = cx + Math.sin(a) * rr, y = cy - Math.cos(a) * rr;
    i ? c.lineTo(x, y) : c.moveTo(x, y);
  }
  c.strokeStyle = o.color || '#4fc3f7'; c.lineWidth = 2; c.stroke();
  if (o.markerAngle != null) {
    const ang = o.markerAngle;
    const rr = clamp(o.fn(ang), 0, 1.15) * R;
    const x = cx + Math.sin(ang) * rr, y = cy - Math.cos(ang) * rr;
    c.strokeStyle = 'rgba(255,213,79,.45)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(cx, cy); c.lineTo(x, y); c.stroke();
    c.fillStyle = '#ffd54f'; c.beginPath(); c.arc(x, y, 4.5, 0, TAU); c.fill();
  }
  sText(c, cx, 9, o.top || '', '#7d8db0', 10);
  sText(c, W - 6, cy + R + 8, o.lab || '', '#61708f', 9.5, 'right');
}
function curvePlot(cv, o) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.clientWidth || 150, H = cv.clientHeight || 118;
  if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);
  const L = 26, B = 20, T = 14, R = 8;
  const pw = W - L - R, ph = H - B - T;
  c.strokeStyle = '#1e2942'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(L, T); c.lineTo(L, T + ph); c.lineTo(L + pw, T + ph); c.stroke();
  c.beginPath();
  for (let i = 0; i <= 120; i++) {
    const u = i / 120;
    const x = L + u * pw, y = T + ph - clamp(o.fn(u), 0, 1) * ph;

  if (o.marker != null) {

    const x = L + u * pw, y = T + ph - clamp(o.fn(u), 0, 1) * ph;

    c.fillStyle = '#ffd54f'; c.beginPath(); c.arc(x, y, 4, 0, TAU); c.fill();

  sText(c, L, 8, o.top || '', '#7d8db0', 10, 'left');
  sText(c, W - 6, H - 6, o.xlab || '', '#61708f', 9.5, 'right');

const HALF = 0.75;                 // halbe Dipollänge [m]  (λ/2 bei 100 MHz)
const F0 = 100e6;                  // Bezugsfrequenz
const LAM0 = C0 / F0;              // 3,0 m

const WARM = [255, 112, 67], COOL = [86, 138, 255], CYAN = [72, 214, 232], LAMPC = [255, 214, 90];
function mixc(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }

/* ---------- 3D-Zeichenprimitive mit Tiefensortierung ---------- */
function P3(V, a, b, color, w, dash) {
  const A = V.proj(a), B = V.proj(b); if (A.z < 0.06 || B.z < 0.06) return;
  V.push((A.z + B.z) * .5, () => sLine(V.ctx, A, B, color, w, dash));
}
function A3(V, a, b, color, w, head) {
  const A = V.proj(a), B = V.proj(b); if (A.z < 0.06 || B.z < 0.06) return;
  const d = Math.hypot(A.x - B.x, A.y - B.y); if (d < 1.1) return;
  V.push((A.z + B.z) * .5, () => sArrow(V.ctx, A, B, color, w, head || 8));
}
function T3(V, p, txt, color, size, dy, align) {
  const A = V.proj(p); if (A.z < 0.06) return;
  V.push(A.z, () => sText(V.ctx, A.x, A.y + (dy || 0), txt, color || '#cfe3ff', size || 11.5, align));
}
function SEG3(V, pts, color, w, dash) { for (let i = 0; i + 1 < pts.length; i++)P3(V, pts[i], pts[i + 1], color, w, dash); }
function bg(V) {
  const c = V.ctx, H = V.H;
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a1025'); g.addColorStop(.55, '#070c19'); g.addColorStop(1, '#04060d');
  c.fillStyle = g; c.fillRect(0, 0, V.W, H);

/* ---------- Hintergrundraster in der Äquatorebene ---------- */
function equatorGrid(V, ext) {
  const step = ext > 4 ? 1 : 0.5;
  for (let r = step; r <= ext * 1.02; r += step) {
    const pts = [];
    for (let i = 0; i <= 64; i++) { const a = i / 64 * TAU; pts.push([r * Math.cos(a), 0, r * Math.sin(a)]); }
    for (let i = 0; i + 1 < pts.length; i++) P3(V, pts[i], pts[i + 1], 'rgba(60,80,120,.42)', 1);
  }
  for (let i = 0; i < 24; i++) {
    const a = i / 24 * TAU;
    P3(V, [0, 0, 0], [ext * Math.cos(a), 0, ext * Math.sin(a)], 'rgba(60,80,120,.22)', 1);
  }
}

/* ---------- Nahfeldgrenze (Kugel r = λ) ---------- */
function nearSphere(V, lam) {
  const C = 'rgba(79,195,247,.55)';
  for (let k = 0; k < 3; k++) {
    const pts = [];
    for (let i = 0; i <= 72; i++) {
      const a = i / 72 * TAU, s = Math.sin(a) * lam, c = Math.cos(a) * lam;
      pts.push(k === 0 ? [s, c, 0] : k === 1 ? [s, 0, c] : [0, s, c]);
    }
    for (let i = 0; i + 1 < pts.length; i++) P3(V, pts[i], pts[i + 1], C, 1.2, [5, 5]);
  }
  T3(V, [0, lam, 0], 'r = λ  (Nahfeldgrenze)', 'rgba(120,200,255,.85)', 11.5, -6);
}

/* ---------- Abstrahlkeule (Toroid) ---------- */
function donut(V, R) {
  const col = 'rgba(255,150,80,.34)';
  for (let th = 15; th < 180; th += 15) {
    const a = th * D2R, pts = [];
    for (let i = 0; i <= 48; i++) {
      const p = i / 48 * TAU;
      pts.push([R * Math.sin(a) * Math.sin(a) * Math.cos(p), R * Math.sin(a) * Math.cos(a), R * Math.sin(a) * Math.sin(a) * Math.sin(p)]);
    }
    for (let i = 0; i + 1 < pts.length; i++) P3(V, pts[i], pts[i + 1], col, 1.2);
  }
  for (let p = 0; p < 12; p++) {
    const pp = p / 12 * TAU, pts = [];
    for (let i = 0; i <= 40; i++) {
      const a = i / 40 * Math.PI;
      pts.push([R * Math.sin(a) * Math.sin(a) * Math.cos(pp), R * Math.sin(a) * Math.cos(a), R * Math.sin(a) * Math.sin(a) * Math.sin(pp)]);
    }
    for (let i = 0; i + 1 < pts.length; i++) P3(V, pts[i], pts[i + 1], col, 1.2);
  }
}

/* ---------- Amplitudenskalierung (logarithmisch, damit Nah- und Fernfeld
     gleichzeitig sichtbar bleiben; Angabe im Bild vermerkt) ---------- */
const LOGK = 9;
function ampScale(a, aRef) { return clamp(Math.log10(1 + LOGK * a / aRef), 0, 1); }

/* ---------- E-Feld: Vertikalschnitt (x-y-Ebene) ---------- */
function quiverVertical(V, st, lam, k, t, ext) {
  const ctx = V.ctx;
  const aref = 2 * (k * k) / lam;
  const NR = 12, NA = 32, rmax = ext * 0.97, rmin = clamp(0.22 * ext, 0.10, 0.42);
  for (let i = 0; i < NR; i++) {
    const r = rmin * Math.pow(rmax / rmin, i / (NR - 1));
    const na = i < 2 ? 8 : (i < 4 ? 16 : (i < 6 ? 24 : 32));
    const Lmax = Math.min(0.13 * r + 0.02 * ext, ext * 0.085);
    for (let j = 0; j < na; j++) {
      const th = j * TAU / na + (NA / na - 1) * Math.PI / NA;
      const x = r * Math.sin(th), y = r * Math.cos(th);
      const f = dipoleField(x, y, 0, t, k);
      const a = Math.hypot(f.E[0], f.E[1]);
      if (a < 1e-9) continue;
      const len = Lmax * ampScale(a, aref);
      const ux = f.E[0] / a, uy = f.E[1] / a;
      const A = V.proj([x - ux * len * .5, y - uy * len * .5, 0]);
      const B = V.proj([x + ux * len * .5, y + uy * len * .5, 0]);
      if (A.z < 0.06 || B.z < 0.06) continue;
      const scr = Math.hypot(A.x - B.x, A.y - B.y);
      if (scr < 2.0) continue;
      const vert = Math.min(1, Math.abs(f.E[1]) / a + 0.15);
      const col = rgba(mixc(COOL, WARM, f.E[1] > 0 ? 1 : 0), 0.22 + 0.62 * Math.max(vert, ampScale(a, aref) * .8));
      V.push((A.z + B.z) * .5, () => sArrow(ctx, A, B, col, Math.max(1.05, scr * .07), Math.min(6.5, 1.5 + scr * .45)));
    }
  }
}
/* ---------- B-Feld: Vertikalschnitt (Symbole aus/in der Ebene) ---------- */
function quiverBVertical(V, st, lam, k, t, ext) {
  const ctx = V.ctx, fwd = V._F.f;
  const aref = 2 * (k * k) / lam;
  const NR = 6, NA = 14, rmax = ext * 0.95, rmin = clamp(0.26 * ext, 0.18, 0.7);
  for (let i = 0; i < NR; i++) {
    const r = rmin * Math.pow(rmax / rmin, i / (NR - 1));
    for (let j = 0; j < NA; j++) {
      const th = j * TAU / NA;
      const x = r * Math.sin(th), y = r * Math.cos(th);
      const f = dipoleField(x, y, 0, t, k);
      const b = Math.abs(f.Bp); if (b < 1e-12) continue;
      const s = ampScale(b, aref); if (s < 0.04) continue;
      const A = V.proj([x, y, 0]); if (A.z < 0.06) continue;
      const rad = 2 + 7 * s;
      const away = v3.dot(f.B, fwd) < 0;        // zeigt das Feld zum Betrachter?
      const col = rgba(CYAN, 0.3 + 0.6 * s);
      V.push(A.z, () => {
        ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(A.x, A.y, rad, 0, TAU); ctx.stroke();
        if (away) {
          ctx.beginPath(); ctx.arc(A.x, A.y, Math.max(1.1, rad * .28), 0, TAU); ctx.fill();
        } else {
          const q = rad * .72;
          ctx.beginPath(); ctx.moveTo(A.x - q, A.y - q); ctx.lineTo(A.x + q, A.y + q);
          ctx.moveTo(A.x + q, A.y - q); ctx.lineTo(A.x - q, A.y + q); ctx.stroke();
        }
        ctx.restore();
      });
    }
  }
}
/* ---------- Felder im Horizontalschnitt (y = 0) ---------- */
function quiverHorizontal(V, st, lam, k, t, ext) {
  const ctx = V.ctx;
  const aref = 2 * (k * k) / lam;
  const NR = 5, NA = 24, rmin = 0.5, rmax = ext * 0.95;
  for (let i = 0; i < NR; i++) {
    const r = rmin * Math.pow(rmax / rmin, i / (NR - 1));
    const Lmax = Math.min(0.16 * r + 0.02 * ext, ext * 0.1);
    for (let j = 0; j < NA; j++) {
      const ph = j * TAU / NA + (i % 2) * (TAU / NA / 2);
      const x = r * Math.cos(ph), z = r * Math.sin(ph);
      const f = dipoleField(x, 0, z, t, k);
      /* E (senkrecht) */
      if (st.showE) {
        const a = Math.hypot(f.E[0], f.E[1], f.E[2]); if (a > 1e-9) {
          const len = Lmax * ampScale(a, aref);
          const uy = f.E[1] / a;
          const A = V.proj([x, -uy * len * .5, z]), B = V.proj([x, uy * len * .5, z]);
          if (A.z > .06 && B.z > .06) {
            const scr = Math.hypot(A.x - B.x, A.y - B.y);
            if (scr > 2) {
              const col = rgba(f.E[1] > 0 ? WARM : COOL, 0.25 + 0.6 * Math.abs(uy));
              V.push((A.z + B.z) * .5, () => sArrow(ctx, A, B, col, Math.max(1.05, scr * .07), Math.min(6.5, 1.5 + scr * .4)));
            }
          }
        }
      }
      /* B (tangential) */
      if (st.showB) {
        const b = Math.abs(f.Bp); if (b > 1e-12) {
          const len = Lmax * 1.1 * ampScale(b, aref);
          const ux = f.B[0] / b, uz = f.B[2] / b;
          const A = V.proj([x - ux * len * .5, 0, z - uz * len * .5]);
          const B = V.proj([x + ux * len * .5, 0, z + uz * len * .5]);
          if (A.z > .06 && B.z > .06) {
            const scr = Math.hypot(A.x - B.x, A.y - B.y);
            if (scr > 2) V.push((A.z + B.z) * .5, () => sArrow(ctx, A, B, rgba(CYAN, .6), 1.4, 6));
          }
        }
      }
    }
  }
}

/* ---------- Kleines Diagramm: E und B in Phase (Folie 11) ---------- */
function phasePlot(cv, ph, delta) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.clientWidth || 150, H = cv.clientHeight || 118;
  if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);
  const L = 20, B = 18, T = 16, R = 26;
  const pw = W - L - R, phh = H - B - T, mid = T + phh / 2;
  c.strokeStyle = '#1e2942'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(L, T); c.lineTo(L, T + phh); c.lineTo(L + pw, T + phh); c.stroke();
  c.beginPath(); c.moveTo(L, mid); c.lineTo(L + pw, mid); c.stroke();
  const N = 120;
  const curves = [[WARM, 1, 0], [CYAN, 0.78, delta || 0]];
  curves.forEach(([col, sc, off]) => {
    c.beginPath();
    for (let i = 0; i <= N; i++) {
      const u = i / N, x = L + u * pw;
      const y = mid - sc * (phh * 0.40) * Math.sin(u * TAU * 2 - ph + off);
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    }
    c.strokeStyle = rgba(col, .95); c.lineWidth = 1.8; c.stroke();
  });
  const u0 = 0.58, x0 = L + u0 * pw;
  c.save(); c.setLineDash([3, 3]); c.strokeStyle = 'rgba(150,175,215,.55)'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(x0, T); c.lineTo(x0, T + phh); c.stroke(); c.restore();
  curves.forEach(([col, sc, off]) => {
    const y = mid - sc * (phh * 0.40) * Math.sin(u0 * TAU * 2 - ph + off);
    c.fillStyle = rgba(col, 1); c.beginPath(); c.arc(x0, y, 3.4, 0, TAU); c.fill();
  });
  sText(c, L, 8, delta ? 'Δφ = ' + Math.round(Math.abs(delta) * 180 / Math.PI) + '°' : 'E und B in Phase', '#7d8db0', 10, 'left');
  sText(c, W - 6, T + 6, 'E', '#ff7043', 11, 'right');
  sText(c, W - 6, T + phh - 6, 'B', '#48d6e8', 11, 'right');
  sText(c, L + pw, H - 5, '→ x', '#61708f', 9.5, 'right');
}

/* ---------- Phasendifferenz E/B über dem Abstand (log. Achse) ---------- */
function phaseDiffPlot(cv, k, lam, rNow) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.clientWidth || 150, H = cv.clientHeight || 118;
  if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);
  const L = 26, B = 20, T = 16, R = 10;
  const pw = W - L - R, phh = H - B - T;
  const X = u => L + u * pw, Y = d => T + phh * (1 - d / 90);
  c.strokeStyle = '#1e2942'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(L, T); c.lineTo(L, T + phh); c.lineTo(L + pw, T + phh); c.stroke();
  c.strokeStyle = 'rgba(34,48,78,.9)';
  [0.1, 1].forEach(rl => {
    const u = Math.log10(rl / 0.03) / 2;
    c.beginPath(); c.moveTo(X(u), T); c.lineTo(X(u), T + phh); c.stroke();
    sText(c, X(u), T + phh + 10, rl < 1 ? '0,1λ' : 'λ', '#61708f', 9);
  });
  c.beginPath();
  for (let i = 0; i <= 120; i++) {
    const u = i / 120;
    const r = 0.03 * Math.pow(100, u) * lam;
    const d = fieldPhaseDiff(Math.max(r, 1e-3), k);
    i ? c.lineTo(X(u), Y(d)) : c.moveTo(X(u), Y(d));
  }
  c.strokeStyle = '#7c5cff'; c.lineWidth = 2; c.stroke();
  const uNow = clamp(Math.log10(Math.max(rNow / lam, 0.0301) / 0.03) / 2, 0, 1);
  const dNow = fieldPhaseDiff(Math.max(rNow, 1e-3), k);
  c.save(); c.setLineDash([3, 3]); c.strokeStyle = 'rgba(255,213,79,.5)';
  c.beginPath(); c.moveTo(X(uNow), T); c.lineTo(X(uNow), T + phh); c.stroke(); c.restore();
  c.fillStyle = '#ffd54f'; c.beginPath(); c.arc(X(uNow), Y(dNow), 4, 0, TAU); c.fill();
  sText(c, L, 8, 'Phasendifferenz E–B', '#7d8db0', 10, 'left');
  sText(c, L - 3, T + 4, '90°', '#61708f', 9.5, 'right');
  sText(c, L - 3, T + phh + 4, '0°', '#61708f', 9.5, 'right');
  sText(c, W - 6, H - 6, 'r / λ →', '#61708f', 9.5, 'right');
}

/* ---------- Speisung: die Spannung liegt in der Mitte am Spalt an ----------
   Der Generator speist die beiden Dipolhälften an ihren inneren Enden.
   Damit ist klar: die beiden Hälften sind die beiden "Platten" des
   aufgebogenen Kondensators, die Ladungen sitzen an den äußeren Enden. */
const GAP = 0.055;
function drawGenerator(V) {
  /* kleiner Speiseblock im Spalt zwischen den Dipolhälften */
  const hx = 0.075, hy = 0.085, hz = 0.075;
  const c = 'rgba(190,205,235,.8)';
  const bot = [[-hx, -hy, -hz], [hx, -hy, -hz], [hx, -hy, hz], [-hx, -hy, hz]];
  const top = [[-hx, hy, -hz], [hx, hy, -hz], [hx, hy, hz], [-hx, hy, hz]];
  for (let i = 0; i < 4; i++) {
    P3(V, bot[i], bot[(i + 1) % 4], c, 1.4);
    P3(V, top[i], top[(i + 1) % 4], c, 1.4);
    P3(V, bot[i], top[i], c, 1.4);
  }
  /* zwei Zuführungen zum Generatorgehäuse */
  P3(V, [hx, -hy, 0], [0.085, -0.98, 0], 'rgba(150,170,205,.55)', 1.5);
  P3(V, [-hx, -hy, 0], [-0.085, -0.98, 0], 'rgba(150,170,205,.55)', 1.5);

  /* Gehäuse des Hochfrequenzgenerators unten */
  const x0 = -0.44, x1 = 0.44, z0 = -0.28, z1 = 0.28, y0 = -1.80, y1 = -1.00;
  const bc = 'rgba(140,160,200,.5)';
  const bot2 = [[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]];
  const top2 = [[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]];
  for (let i = 0; i < 4; i++) {
    P3(V, bot2[i], bot2[(i + 1) % 4], bc, 1.2);
    P3(V, top2[i], top2[(i + 1) % 4], bc, 1.2);
    P3(V, bot2[i], top2[i], bc, 1.2);
  }
  T3(V, [0, y0 - 0.20, 0], 'Hochfrequenzgenerator', 'rgba(185,205,235,.85)', 11);
}

/* ---------- Sendedipol mit Ladungen und Strom ---------- */
function drawRod(V, st, t) {
  [[-HALF, -GAP], [GAP, HALF]].forEach(([a, b]) => {
    P3(V, [0, a, 0], [0, b, 0], 'rgba(120,140,175,.30)', 9);
    P3(V, [0, a, 0], [0, b, 0], '#c9d6ef', 3.4);
  });
  if (!st.showCharges) return;
  const N = 17;
  const A = V.proj([0, -HALF, 0]), B = V.proj([0, HALF, 0]);
  for (let i = 0; i < N; i++) {
    const s = i / (N - 1), y = -HALF + 2 * HALF * s;
    const q = -Math.cos(Math.PI * s) * Math.cos(t);
    const cur = Math.sin(Math.PI * s) * Math.sin(t);
    const px = lerp(A.x, B.x, s), py = lerp(A.y, B.y, s);
    const zz = A.z + (B.z - A.z) * s;
    if (zz < .06) continue;
    const rq = Math.abs(q);
    if (rq > .04) {
      const col = rgba(mixc(COOL, WARM, q > 0 ? 1 : 0), .25 + .7 * rq);
      const rad = 1.6 + 10 * rq;
      V.push(zz, () => {
        const c = V.ctx; c.save();
        c.fillStyle = col; c.beginPath(); c.arc(px, py, rad, 0, TAU); c.fill();
        if (rad > 7.5) {
          c.fillStyle = '#08101f'; c.font = 'bold ' + (rad * 1.35).toFixed(0) + 'px system-ui';
          c.textAlign = 'center'; c.textBaseline = 'middle';
          c.fillText(q > 0 ? '+' : '–', px, py + rad * .06);
        }
        c.restore();
      });
    }
    if (i % 2 === 0 && Math.abs(cur) > .12) {
      const dir = cur > 0 ? 1 : -1;
      const dy = (B.y - A.y) * 0.035 * dir;
      const col = 'rgba(255,235,180,' + (.3 + .55 * Math.abs(cur)) + ')';
      V.push(zz - .01, () => {
        const c = V.ctx; c.save(); c.strokeStyle = col; c.lineWidth = 1.8; c.lineCap = 'round';
        c.beginPath(); c.moveTo(px + 9, py - dy * Math.abs(cur)); c.lineTo(px + 9, py + dy * Math.abs(cur)); c.stroke();
        c.beginPath(); c.moveTo(px + 5, py + dy * Math.abs(cur) * .45); c.lineTo(px + 9, py + dy * Math.abs(cur));
        c.lineTo(px + 13, py + dy * Math.abs(cur) * .45); c.stroke(); c.restore();
      });
    }
  }
}

/* ---------- Empfangsdipol / Induktionsschleife ---------- */
function circle3(V, c, axis, rad, color, w, dash) {
  const a = v3.norm(axis);
  let u = Math.abs(a[1]) < .9 ? v3.norm(v3.cross(a, [0, 1, 0])) : v3.norm(v3.cross(a, [1, 0, 0]));
  const v = v3.cross(a, u);
  const pts = [];
  for (let i = 0; i <= 48; i++) {
    const q = i / 48 * TAU;
    pts.push([c[0] + rad * (u[0] * Math.cos(q) + v[0] * Math.sin(q)),
              c[1] + rad * (u[1] * Math.cos(q) + v[1] * Math.sin(q)),
              c[2] + rad * (u[2] * Math.cos(q) + v[2] * Math.sin(q))]);
  }
  SEG3(V, pts, color, w, dash);
}

function reception(st, k) {
  const R = st.receiver; if (!R) return null;
  const th = R.theta * D2R, ph = R.phi * D2R;
  const pos = [R.r * Math.sin(th) * Math.cos(ph), R.r * Math.cos(th), R.r * Math.sin(th) * Math.sin(ph)];
  const f = dipoleField(pos[0], pos[1], pos[2], 0, k);
  const r = Math.max(R.r, 0.06);
  const sint = Math.min(1, Math.hypot(pos[0], pos[2]) / r);
  const Aref = (k * k) / 0.5;                     // Bezug: Fernfeld bei r = 0,50 m
  let A, G, kind = R.mode;
  if (kind === 'loop') {
    G = Math.abs(Math.cos(R.gamma * D2R));
    A = ampBphi(r, sint, k) / Aref * G * (st.f / F0);
  } else {
    if (st.gridOn) { const a = st.gridA * D2R, b = R.beta * D2R; G = Math.abs(Math.sin(a) * Math.sin(a - b)); }
    else { const b = R.beta * D2R; G = Math.abs(Math.cos(b)); }
    A = ampTheta(r, sint, k) / Aref * G;
  }
  return { pos, that: f.th, phv: f.ph, amp: A, P: A * A, G, r, sint, f };
}
function ampFrom(st, k, r, thetaDeg, betaDeg, gridOn, gridA) {
  const th = thetaDeg * D2R, rho = r * Math.sin(th);
  const sint = Math.min(1, Math.abs(rho) / Math.max(r, .06));
  const Aref = (k * k) / 0.5;
  const rr = Math.max(r, .06);
  if (st.receiver && st.receiver.mode === 'loop') {
    return ampBphi(rr, sint, k) / Aref * Math.abs(Math.cos(st.receiver.gamma * D2R)) * (st.f / F0);
  }
  let G;
  if (gridOn) { const a = gridA * D2R, b = betaDeg * D2R; G = Math.abs(Math.sin(a) * Math.sin(a - b)); }
  else G = Math.abs(Math.cos(betaDeg * D2R));
  return ampTheta(rr, sint, k) / Aref * G;
}

function drawReceiver(V, st, k, t, res) {
  const R = st.receiver;
  const pos = res.pos, that = res.that, phv = res.phv;
  const b = R.beta * D2R;
  const ext = st.extent || 3;
  const lam = C0 / st.f, aref = 2 * (k * k) / lam;
  const Lref = 0.14 * ext;

  /* Sichtlinie Sender → Empfänger */
  P3(V, [0, 0, 0], pos, 'rgba(120,150,200,.28)', 1, [4, 6]);

  /* Empfänger */
  if (R.mode === 'probe') {
    const Ap = V.proj(pos);
    if (Ap.z > 0.06) V.push(Ap.z, () => {
      const c2 = V.ctx; c2.save();
      c2.beginPath(); c2.arc(Ap.x, Ap.y, 11, 0, TAU); c2.fillStyle = 'rgba(120,220,255,.16)'; c2.fill();
      c2.beginPath(); c2.arc(Ap.x, Ap.y, 4.5, 0, TAU); c2.fillStyle = '#8fe0ff'; c2.fill();
      c2.strokeStyle = 'rgba(255,255,255,.85)'; c2.lineWidth = 1.4; c2.stroke();
      c2.restore();
    });
    T3(V, v3.add(pos, [0, 0.24, 0]), 'Messpunkt', 'rgba(160,220,255,.9)', 11.5, -6);
  } else if (R.mode === 'loop') {
    const g = R.gamma * D2R;
    const n = v3.add(v3.mul(that, Math.sin(g)), v3.mul(phv, Math.cos(g)));
    circle3(V, pos, n, 0.26, '#d8e4ff', 2.6);
    A3(V, pos, v3.add(pos, v3.mul(n, 0.42)), 'rgba(140,220,255,.85)', 1.6, 7);
    T3(V, v3.add(pos, v3.mul(n, .5)), 'n̂', 'rgba(140,220,255,.9)', 11);
  } else {
    const d = v3.add(v3.mul(that, Math.cos(b)), v3.mul(phv, Math.sin(b)));
    const e1 = v3.add(pos, v3.mul(d, -0.26)), e2 = v3.add(pos, v3.mul(d, 0.26));
    P3(V, e1, e2, 'rgba(120,140,175,.35)', 11);
    P3(V, e1, e2, '#e7eeff', 4);
  }
  if (R.mode !== 'probe')
    T3(V, v3.add(pos, [0, 0.46, 0]), R.mode === 'loop' ? 'Induktionsschleife' : 'Empfangsdipol', 'rgba(220,230,255,.85)', 12, -8);
  /* momentane Feldvektoren am Empfänger (durch das Gitter ggf. gefiltert) */
  const loc = dipoleField(pos[0], pos[1], pos[2], t, k);
  let vecT = v3.mul(that, v3.dot(loc.E, that));
  if (st.gridOn) {
    const A = st.gridA * D2R;
    const bt = v3.add(v3.mul(that, Math.cos(A)), v3.mul(phv, Math.sin(A)));
    vecT = v3.sub(vecT, v3.mul(bt, v3.dot(vecT, bt)));
  }
  if (st.showFieldArrows) {
    const mT = v3.len(vecT);
    if (mT > 1e-9) {
      const l = Lref * ampScale(mT, aref);
      const u = v3.mul(vecT, 1 / mT);
      A3(V, pos, v3.add(pos, v3.mul(u, l)), rgba(mixc(COOL, WARM, u[1] > 0 ? 1 : 0), .92), 2.2, 10);
      T3(V, v3.add(pos, v3.mul(u, l * 1.2)), 'E', '#ff8f6a', 12);
    }
    const mB = v3.len(loc.B);
    if (mB > 1e-9) {
      const l = Lref * 0.85 * ampScale(mB, aref);
      const u = v3.mul(loc.B, 1 / mB);
      A3(V, pos, v3.add(pos, v3.mul(u, l)), 'rgba(72,214,232,.9)', 2, 9);
      T3(V, v3.add(pos, v3.mul(u, l * 1.25)), 'B', '#48d6e8', 12);
    }
  }

  /* Metallgitter */
  if (st.gridOn) {
    const gc = v3.mul(pos, 0.68);
    const A = st.gridA * D2R;
    const bt = v3.add(v3.mul(that, Math.cos(A)), v3.mul(phv, Math.sin(A)));
    const ct = v3.add(v3.mul(that, -Math.sin(A)), v3.mul(phv, Math.cos(A)));
    const S = 0.56;
    const cor = [
      v3.add(gc, v3.add(v3.mul(bt, -S), v3.mul(ct, -S))),
      v3.add(gc, v3.add(v3.mul(bt, S), v3.mul(ct, -S))),
      v3.add(gc, v3.add(v3.mul(bt, S), v3.mul(ct, S))),
      v3.add(gc, v3.add(v3.mul(bt, -S), v3.mul(ct, S)))
    ];
    SEG3(V, [cor[0], cor[1], cor[2], cor[3], cor[0]], 'rgba(150,170,205,.75)', 1.6);
    for (let u = -0.42; u < 0.421; u += 0.075) {
      const o = v3.add(gc, v3.mul(ct, u));
      P3(V, v3.add(o, v3.mul(bt, S)), v3.add(o, v3.mul(bt, -S)), 'rgba(190,205,230,.85)', 1.3);
    }
    T3(V, v3.add(gc, v3.mul(ct, -0.86)), 'Gitter α = ' + num(st.gridA, 0) + '°', 'rgba(170,200,235,.9)', 11);
    /* Zerlegung des E-Feldes am Gitter */
    const loc2 = dipoleField(gc[0], gc[1], gc[2], t, k);
    const peak = ampTheta(Math.max(v3.len(gc), 0.06), res.sint, k);
    const sc = peak > 1e-9 ? 0.5 / peak : 0;
    const Ev = v3.mul(that, v3.dot(loc2.E, that) * sc);
    const parV = v3.mul(bt, v3.dot(Ev, bt));
    const perV = v3.sub(Ev, parV);
    A3(V, gc, v3.add(gc, Ev), 'rgba(233,238,251,.85)', 2, 9);
    A3(V, gc, v3.add(gc, parV), 'rgba(255,110,110,.6)', 2, 8);
    A3(V, gc, v3.add(gc, perV), 'rgba(255,180,80,.95)', 2.4, 10);
    T3(V, v3.add(gc, perV), 'E⊥', '#ffb74d', 11.5, -8);
    T3(V, v3.add(gc, parV), 'E∥', 'rgba(255,150,150,.9)', 11.5, 8);
  }
}

/* ---------- Gesamtszene ---------- */
function renderDipole(V, st, dt) {
  const ctx = V.ctx;
  st.phase += TAU * st.slow * dt;
  const lam = C0 / st.f, k = TAU / lam, t = st.phase;
  const ext = st.extFixed || Math.max(lam * 1.05, st.receiver ? st.receiver.r * 1.12 : 0, 1.35);
  st.extent = ext;
  if (st.autoFit) V.cam.dist = lerp(V.cam.dist, V.needDist(ext), 0.07);
  V.begin();
  bg(V);
  if (st.showEqGrid !== false) equatorGrid(V, ext);
  if (st.showFronts) waveFronts(V, lam, st.phase, ext);
  if (st.showDonut) donut(V, ext * 0.86);
  if (st.showNear) nearSphere(V, lam);
  if (st.cut === 'vertical') {
    if (st.showE) quiverVertical(V, st, lam, k, t, ext);
    if (st.showB) quiverBVertical(V, st, lam, k, t, ext);
    if (st.showS) quiverS(V, st, lam, k, t, ext);
  } else {
    quiverHorizontal(V, st, lam, k, t, ext);
  }
  const res = reception(st, k);
  if (res) drawReceiver(V, st, k, t, res);
  if (st.showGenerator) drawGenerator(V);
  drawRod(V, st, t);
  P3(V, [0.10, HALF - 0.10, 0], [0.42, HALF + 0.30, 0], 'rgba(160,180,215,.5)', 1, [3, 4]);
  T3(V, [0.46, HALF + 0.34, 0], 'Sendedipol', 'rgba(220,230,255,.85)', 12, 0);
  V.flush();
  st.result = res;
  return { lam, k, t, res };
}

function drawLamp(V, st, res) {
  if (!res) return;
  if (st.receiver && st.receiver.mode === 'probe') return;
  const A = V.proj(res.pos); if (A.z < .06) return;
  const P = clamp(res.P, 0, 4);
  const g = Math.pow(clamp(P, 0, 1.4), 0.34);
  const R = 9 + 34 * g;
  if (g > 0.02) sGlow(V.ctx, A.x, A.y, R, 'rgba(255,205,80,A)', Math.min(1, .35 + g));
  const c = V.ctx;
  c.save();
  c.beginPath(); c.arc(A.x, A.y, 6.5, 0, TAU);
  c.fillStyle = rgba(mixc([70,70,80], LAMPC, Math.min(1, g * 1.2)), 1); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 1.2; c.stroke();
  c.restore();
}

/* =========================================================================
   Teil 3: Ansichten – Schwingkreis, Felder, Senden/Empfangen,
           Polarisation, Versuch, Formeln
   ========================================================================= */
const R2D = 180 / Math.PI;

/* ==================== 1 · Schwingkreis → Dipol ==================== */
function lcPath(g, s) {
  const R = 0.52, d0 = 0.155;
  const a0 = Math.PI / 2 + d0, a1 = Math.PI / 2 - d0 + TAU;
  const ang = lerp(a0, a1, s);
  const p0x = R * Math.cos(ang), p0y = R * Math.sin(ang);
  const p1x = -1 + 2 * s, p1y = 0;
  return [lerp(p0x, p1x, g), lerp(p0y, p1y, g)];
}

addView('lc', '1 · Schwingkreis → Dipol', V => {
  const st = { g: 0, gt: 0, ph: 0 };
  const G = grid(V.panel);
  const sG = slider(G, {
    label: 'Aufbiegen → Abwickeln → Verkleinern', min: 0, max: 1, step: 0.005, value: 0,
    fmt: v => num(v * 100, 0) + ' %',
    on: v => { st.gt = v; }
  });
  seg(G, {
    label: 'Schritte', value: 'g0', options: [
      { v: 'g0', label: '① Schwingkreis' },
      { v: 'g1', label: '② Aufbiegen' },
      { v: 'g2', label: '③ Abwickeln' },
      { v: 'g3', label: '④ Dipol' }],
    on: v => {
      const m = { g0: 0, g1: .45, g2: .78, g3: 1 };
      sG.set(m[v]); st.gt = m[v];
    }
  });
  const RO = readouts(G);
  RO.add('f', 'Frequenz');
  RO.add('lam', 'Wellenlänge λ');
  RO.add('l', 'Induktivität L');
  RO.add('c', 'Kapazität C');
  RO.add('r', 'λ : Dipollänge');
  note(G, 'In jedem Schritt steigt die Frequenz: <b>Plattenabstand größer, Fläche kleiner, Windungszahl geringer</b> → L und C sinken stark und f = 1/(2π√(L·C)) steigt. ' +
    'Erst wenn die Antenne die Größenordnung der Wellenlänge erreicht (λ ≈ Meter), wird merklich Leistung abgestrahlt – ein kompakter Schwingkreis strahlt praktisch nichts ab.');
  note(G, '<b>Merke:</b> Der hertzsche Dipol ist ein gerades Drahtstück, das wie ein Schwingkreis mit sehr kleiner Induktivität und sehr kleiner Kapazität wirkt. Ladungen schwingen im Stab hin und her.');

  V.draw = dt => {
    st.g = lerp(st.g, st.gt, Math.min(1, dt * 9));
    const g = st.g;
    st.ph += TAU * (0.22 + 1.0 * g) * dt;
    const c = V.ctx, W = V.W, H = V.H;
    c.clearRect(0, 0, W, H); bg(V);
    const S = Math.min(W / 2.9, H / 2.15), cx = W / 2, cy = H * 0.47;
    const X = x => cx + x * S, Y = y => cy - y * S;
    const N = 150;

    const base = [];
    for (let i = 0; i <= N; i++) base.push(lcPath(g, i / N));
    const coilA = 0.115 * Math.pow(1 - g, 0.55);
    const coilW = 0.15 + 0.11 * g;                 // Wickelbereich dehnt sich aus
    const coilN = 6 * Math.pow(1 - g, 1.15);       // Windungszahl sinkt beim Abwickeln
    const path = [];
    for (let i = 0; i <= N; i++) {
      const s = i / N, p = base[i];
      const p1 = base[Math.min(N, i + 1)], p0 = base[Math.max(0, i - 1)];
      let tx = p1[0] - p0[0], ty = p1[1] - p0[1]; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      let off = 0, offA = 0;
      if (coilN > 0.02 && s > 0.5 - coilW && s < 0.5 + coilW) {
        const th = (s - (0.5 - coilW)) / (2 * coilW) * TAU * coilN;
        off = coilA * Math.cos(th);
        offA = coilA * 0.7 * Math.sin(th);
      }
      path.push([p[0] - ty * off + tx * offA, p[1] + tx * off + ty * offA]);
    }
    c.save();
    c.strokeStyle = 'rgba(255,255,255,.09)'; c.lineWidth = 12; c.lineJoin = 'round'; c.lineCap = 'round';
    c.beginPath(); path.forEach((p, i) => i ? c.lineTo(X(p[0]), Y(p[1])) : c.moveTo(X(p[0]), Y(p[1]))); c.stroke();
    c.restore();
    const rho = s => -Math.cos(Math.PI * s) * Math.cos(st.ph);
    const curr = s => ((1 - g) + g * Math.sin(Math.PI * s)) * Math.sin(st.ph);
    for (let i = 0; i < N; i++) {
      const q = rho((i + .5) / N), a = Math.abs(q);
      const col = rgba(mixc(COOL, WARM, q > 0 ? 1 : 0), 0.16 + 0.8 * a);
      const p = path[i], q2 = path[i + 1];
      sLine(c, { x: X(p[0]), y: Y(p[1]) }, { x: X(q2[0]), y: Y(q2[1]) }, col, 4.4);
    }
    for (let i = 4; i < N - 3; i += 9) {
      const i0 = curr(i / N);
      if (Math.abs(i0) < .16) continue;
      const p = path[i], p1 = path[i + 1];
      const dx = (p1[0] - p[0]) * S, dy = -(p1[1] - p[1]) * S;
      const L = Math.hypot(dx, dy) || 1;
      const ux = dx / L * Math.sign(i0), uy = dy / L * Math.sign(i0);
      const len = 7 + 13 * Math.abs(i0);
      sArrow(c, { x: X(p[0]) - ux * len / 2, y: Y(p[1]) - uy * len / 2 },
        { x: X(p[0]) + ux * len / 2, y: Y(p[1]) + uy * len / 2 },
        'rgba(255,235,185,' + (.35 + .6 * Math.abs(i0)) + ')', 1.9, 7);
    }
    const pw = 0.34 * Math.pow(Math.max(0, 1 - g * 1.12), 0.8);
    if (pw > 0.012) {
      [0, 1].forEach(e => {
        const i = e ? N : 0, j = e ? N - 1 : 1;
        let tx = path[i][0] - path[j][0], ty = path[i][1] - path[j][1];
        const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
        const nx = -ty, ny = tx, p = path[i];
        sLine(c, { x: X(p[0] + nx * pw), y: Y(p[1] + ny * pw) }, { x: X(p[0] - nx * pw), y: Y(p[1] - ny * pw) }, '#dfe8fa', 5.5);
        const qs = rho(e ? 1 : 0);
        const col = rgba(mixc(COOL, WARM, qs > 0 ? 1 : 0), .35 + .65 * Math.abs(qs));
        sLine(c, { x: X(p[0] + nx * pw), y: Y(p[1] + ny * pw) }, { x: X(p[0] - nx * pw), y: Y(p[1] - ny * pw) }, col, 3);
        sText(c, X(p[0] + nx * (pw + .09)), Y(p[1] + ny * (pw + .09)), qs > 0 ? '+' : '–', col, 20);
      });
      sText(c, X(path[0][0] - 0.34), Y(path[0][1] + 0.10), 'Kondensator C', 'rgba(200,215,245,.8)', 11.5, 'right');
    }
    if (coilA > 0.01) {
      const p = path[Math.round(N * .5)];
      sText(c, X(p[0]), Y(p[1] - 0.44), 'Spule L', 'rgba(200,215,245,.8)', 11.5);
    }
    if (g > 0.6) sText(c, X(0), Y(-0.34), 'Dipol', 'rgba(255,205,120,' + num((g - .6) / .4 * 9, 2) + ')', 13.5);
    if (g > 0.5) {
      const op = (g - .5) * 2;
      sText(c, X(-1.10), Y(-0.02), 'Drahtende 1', 'rgba(150,170,205,' + (0.7 * op) + ')', 10.5, 'right');
      sText(c, X(1.10), Y(-0.02), 'Drahtende 2', 'rgba(150,170,205,' + (0.7 * op) + ')', 10.5, 'left');
    }

    const f = 1e5 * Math.pow(1000, g);
    const lam = C0 / f;
    RO.set('f', hzStr(f));
    RO.set('lam', lam > 999 ? num(lam / 1000, 2) + ' km' : num(lam, 2) + ' m');
    RO.set('l', num(Math.pow(1000, -g) * 100, 2) + ' %');
    RO.set('c', num(Math.pow(1000, -g) * 100, 2) + ' %');
    RO.set('r', num(lam / 1.5, lam < 10 ? 2 : 0) + ' : 1');
    const bar = (x, y, w, h, v, col, lab) => {
      if (lab) sText(c, x, y + h / 2, lab, '#8fb6e8', 11, 'left');
      x += 42;
      c.fillStyle = 'rgba(34,48,78,.95)'; c.fillRect(x, y, w, h);
      c.fillStyle = col; c.fillRect(x, y, Math.max(2, w * clamp(v, 0, 1)), h);
    };
    const bw = Math.min(W * 0.26, 190);
    const bx0 = W - bw - 54;
    sText(c, bx0, 14, 'log-Skala', '#61708f', 10, 'left');
    bar(bx0, 24, bw, 9, g, '#ffb74d', 'f');
    bar(bx0, 46, bw, 9, 1 - g, '#4fc3f7', 'λ');
    bar(bx0, 68, bw, 9, Math.pow(1000, -g), '#7c5cff', 'C·L');
    V.setBadges(['Schwingkreis: Energie pendelt zwischen E-Feld (C) und B-Feld (L)',
      'Dipol: offener Schwingkreis mit sehr kleiner L und C']);
  };
});

addView('pol', '6 · Polarisation', V => {
  V.cam.yaw = 1.02; V.cam.pitch = 0.26;
  V.homeCam = { yaw: 1.02, pitch: 0.26, dist: 9 };
  const st = { a: 45, mode: 'em', ph: 0, autoFit: true };
  const G = grid(V.panel);
  const sA = slider(G, {
    label: 'Gitterwinkel α (Stäbe gegenüber dem E-Feld)', min: 0, max: 90, step: 1, value: 45,
    fmt: v => num(v, 0) + '°', on: v => st.a = v
  });
  seg(G, {
    label: 'Darstellung', value: 'em',
    options: [{ v: 'em', label: 'E-Welle am Gitter (3D)' }, { v: 'rope', label: 'Seilwellen-Analogie' }],
    on: v => st.mode = v
  });
  const RO = readouts(G);
  RO.add('perp', 'durchgelassen: |E_S,⊥| = |E_S|·sin α', 'warm');
  RO.add('par', 'Empfangsfeld: |E_E,∥| = |E_S|·sin² α', 'warm');
  RO.add('hell', 'Lämpchen: Leistung ∝ |E|²');
  note(G, '<b>Deutung (V1e):</b> Die Stäbe sind <b>parallel</b> zur Schwingungsebene des E-Feldes: Die Welle verschiebt Ladungen in den Stäben (sie werden selbst zu kleinen Sendedipolen) und die Energie wird absorbiert. ' +
    'Stehen die Stäbe <b>senkrecht</b> zum E-Feld, können sie keine Energie aufnehmen → das Feld geht durch. Es wird auf die Richtung senkrecht zu den Stäben „gedreht“ (polarisiert).');
  note(G, '<b>Achtung beim Seil-Vergleich:</b> Beim Seil stehen die Spaltbacken <b>rechtwinklig</b> zur Schwingungsebene, damit die Welle durchkommt – bei der elektromagnetischen Welle müssen die E-Pfeile <b>parallel</b> zu den Gitterstäben liegen, damit die Welle <b>nicht</b> durchkommt.');
  note(G, '<b>Bedienung:</b> Gitter mit dem <b>Regler</b> oder am <b>Drehgriff</b> direkt am Gitter drehen (Finger auf den blauen Punkt setzen und kreisen). ' +
    'Auf der übrigen Fläche ziehen = Ansicht drehen, zwei Finger = zoomen – wie in den Kapiteln 2 und 3.');
  V.setBadges(['α = 45°', '|E_E,∥| = |E_S| · sin² α']);

  /* ---- Drehgriff am Gitter: ziehen dreht α ---- */
  const drawKnob = hp => {
    const c = V.ctx;
    c.save();
    c.beginPath(); c.arc(hp.x, hp.y, 16, 0, TAU); c.fillStyle = 'rgba(79,195,247,.18)'; c.fill();
    c.beginPath(); c.arc(hp.x, hp.y, 10, 0, TAU); c.fillStyle = '#4fc3f7'; c.fill();
    c.strokeStyle = '#eaf7ff'; c.lineWidth = 2; c.stroke();
    c.strokeStyle = 'rgba(8,16,30,.9)'; c.lineWidth = 1.8; c.lineCap = 'round';
    c.beginPath(); c.arc(hp.x, hp.y, 4.6, -0.5, 3.3); c.stroke();
    c.beginPath(); c.moveTo(hp.x + 3.6, hp.y + 3.4); c.lineTo(hp.x + 5.4, hp.y + 0.7); c.stroke();
    c.restore();
  };
  let handleDown = false;
  const handleAlpha = (px, py) => {
    const o = V._handleOrigin;
    if (!o) return st.a;
    let vx = px - o.x, vy = py - o.y;
    const vl = Math.hypot(vx, vy) || 1; vx /= vl; vy /= vl;
    if (st.mode === 'rope' || !V._F) return clamp(Math.atan2(vx, -vy) * R2D, 0, 90);
    let best = st.a, bd = -2;
    for (let t = 0; t <= 90; t++) {
      const A = t * D2R;
      const p = V.proj([0, 0.6 * Math.cos(A), 0.6 * Math.sin(A)]);
      let tx = p.x - o.x, ty = p.y - o.y;
      const tl = Math.hypot(tx, ty) || 1;
      const d = (tx * vx + ty * vy) / tl;
      if (d > bd) { bd = d; best = t; }
    }
    return best;
  };
  V.canvas.addEventListener('pointerdown', e => {
    const h = V._handlePos;
    if (!h) return;
    const r = V.canvas.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    if (Math.hypot(x - h.x, y - h.y) < Math.max(44, h.r)) {
      handleDown = true; V._handleDrag = true;
      st.a = handleAlpha(x, y); sA.set(st.a);
    }
  });
  V.canvas.addEventListener('pointermove', e => {
    if (!handleDown) return;
    const r = V.canvas.getBoundingClientRect();
    st.a = handleAlpha(e.clientX - r.left, e.clientY - r.top);
    sA.set(st.a);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t =>
    V.canvas.addEventListener(t, () => { handleDown = false; V._handleDrag = false; }));
  V.onDrag = () => V._handleDrag === true;
  V.onZoom = () => { st.autoFit = false; };

  V.draw = dt => {
    st.ph += TAU * 0.45 * dt;
    const c = V.ctx, W = V.W, H = V.H;
    c.clearRect(0, 0, W, H); bg(V);
    const a = st.a * D2R, sino = Math.sin(a), cosa = Math.cos(a);
    const lampP = Math.pow(sino * sino, 2);
    RO.set('perp', num(sino, 3) + ' · E_S');
    RO.set('par', num(sino * sino, 3) + ' · E_S');
    RO.set('hell', st.mode === 'em' ? pct(lampP) : pct(cosa * cosa));
    V.setBadges(['α = ' + num(st.a, 0) + '°',
      st.mode === 'em' ? '|E_E,∥| = |E_S| · sin² α' : 'Amplitude ∝ |cos α|']);

    /* ---------------- Seilwellen-Analogie (2D) ---------------- */
    if (st.mode === 'rope') {
      const S = Math.min(W / 2.75, H / 2.25), cx = W / 2, cy = H / 2;
      const X = x => cx + x * S, Y = y => cy - y * S;
      const bar = [sino, cosa], per = [cosa, -sino];
      const P = (x, y) => ({ x: X(x), y: Y(y) });
      const y0 = .08;
      const rope = (fromX, toX, amp) => {
        c.beginPath();
        for (let i = 0; i <= 120; i++) {
          const x = lerp(fromX, toX, i / 120);
          const y = y0 + amp * Math.sin(st.ph * 2 - x * 3.6);
          i ? c.lineTo(X(x), Y(y)) : c.moveTo(X(x), Y(y));
        }
        c.strokeStyle = '#ffd9a8'; c.lineWidth = 3.4; c.lineCap = 'round'; c.stroke();
      };
      rope(-1.3, -0.07, 0.32);
      rope(0.07, 1.3, 0.32 * Math.abs(cosa));
      [-1, 1].forEach(sg => {
        const off = [per[0] * 0.06 * sg, per[1] * 0.06 * sg];
        sLine(c, P(off[0] + bar[0] * .40, y0 + off[1] + bar[1] * .40), P(off[0] - bar[0] * .40, y0 + off[1] - bar[1] * .40), '#cdd9f0', 6);
      });
      sText(c, X(0), Y(y0 + .62), 'Spalt', '#cfe3ff', 12);
      sText(c, X(-1.15), Y(y0 - .55), 'Schwingungsebene der Welle: senkrecht', '#ff8f6a', 11.5);
      sText(c, X(.85), Y(y0 - .55), 'Amplitude ∝ |cos α|', '#ffd9a8', 11.5);
      const g2 = Math.pow(Math.abs(cosa), 1.2);
      if (g2 > .02) sGlow(c, X(1.08), Y(y0), 16 + 36 * g2, 'rgba(255,205,80,A)', Math.min(1, .3 + g2));
      c.beginPath(); c.arc(X(1.08), Y(y0), 7, 0, TAU);
      c.fillStyle = rgba(mixc([70, 70, 80], LAMPC, g2), 1); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1.2; c.stroke();
      /* Drehgriff am Spalt */
      V._handleOrigin = { x: X(0), y: Y(y0) };
      V._handlePos = { x: X(0.62 * bar[0]), y: Y(y0 + 0.62 * bar[1]), z: 1 };
      sLine(c, { x: X(0), y: Y(y0) }, { x: V._handlePos.x, y: V._handlePos.y }, 'rgba(120,200,255,.4)', 1.2, [3, 4]);
      drawKnob(V._handlePos);
      return;
    }

    /* ---------------- 3D: E-Welle am Gitter ---------------- */
    if (st.autoFit) V.cam.dist = lerp(V.cam.dist, V.needDist(1.65), 0.09);
    V.begin();
    const kw = TAU / 1.7;
    const xs = -1.55, xr = 1.45, HalfR = 0.52, Gap = 0.055;
    const qt = Math.cos(st.ph);                      // Ladungsvorzeichen der oberen Hälfte
    const Eph = x => -Math.cos(st.ph - kw * (x - xs));
    const bt = [0, cosa, sino];                      // Stabrichtung des Gitters
    const ct = [0, -sino, cosa];                     // senkrecht dazu
    const ut = [0, sino, -cosa];                     // Richtung des durchgelassenen E-Feldes

    /* Achse */
    P3(V, [xs, 0, 0], [xr + 0.25, 0, 0], 'rgba(90,110,150,.45)', 1, [4, 5]);
    /* E-Feldpfeile vor und nach dem Gitter */
    const tipsB = [], tipsA = [];
    for (let x = xs + 0.26; x <= xr + 0.2; x += 0.185) {
      if (Math.abs(x) < 0.15) continue;
      const trans = x < 0 ? 1 : sino;
      const e = Eph(x) * trans;
      const dir = x < 0 ? [0, 1, 0] : ut;
      const tip = [x, dir[1] * e * 0.34, dir[2] * e * 0.34];
      A3(V, [x, 0, 0], tip, rgba(mixc(COOL, WARM, e > 0 ? 1 : 0), .9), 1.7, 8);
      (x < 0 ? tipsB : tipsA).push(tip);
    }
    SEG3(V, tipsB, 'rgba(255,150,100,.45)', 1.3);
    SEG3(V, tipsA, 'rgba(255,205,130,.55)', 1.3);

    /* Sender */
    [[-HalfR, -Gap], [Gap, HalfR]].forEach(([u, v]) => {
      P3(V, [xs, u, 0], [xs, v, 0], 'rgba(120,140,175,.3)', 9);
      P3(V, [xs, u, 0], [xs, v, 0], '#c9d6ef', 3.4);
    });
    const hx = 0.07;
    SEG3(V, [[xs - hx, -hx, 0], [xs + hx, -hx, 0], [xs + hx, hx, 0], [xs - hx, hx, 0], [xs - hx, -hx, 0]], 'rgba(190,205,235,.8)', 1.4);
    [[HalfR, qt], [-HalfR, -qt]].forEach(([yy, q]) => {
      const A = V.proj([xs, yy, 0]); if (A.z < 0.06) return;
      const rq = Math.abs(q);
      V.push(A.z, () => {
        c.save();
        c.fillStyle = rgba(mixc(COOL, WARM, q > 0 ? 1 : 0), .3 + .65 * rq);
        c.beginPath(); c.arc(A.x, A.y, 4 + 9 * rq, 0, TAU); c.fill();
        if (rq > 0.12) {
          c.fillStyle = '#08101f'; c.font = 'bold 15px system-ui';
          c.textAlign = 'center'; c.textBaseline = 'middle';
          c.fillText(q > 0 ? '+' : '–', A.x, A.y);
        }
        c.restore();
      });
    });
    T3(V, [xs, HalfR + 0.24, 0], 'Sendedipol', 'rgba(220,230,255,.9)', 12);
    T3(V, [xs, -HalfR - 0.26, 0], 'HF-Generator', 'rgba(150,175,215,.85)', 10.5);

    /* Gitter */
    const S = 0.48;
    const cor = [
      v3.add(v3.mul(bt, -S), v3.mul(ct, -S)), v3.add(v3.mul(bt, S), v3.mul(ct, -S)),
      v3.add(v3.mul(bt, S), v3.mul(ct, S)), v3.add(v3.mul(bt, -S), v3.mul(ct, S))
    ];
    SEG3(V, [cor[0], cor[1], cor[2], cor[3], cor[0]], 'rgba(150,170,205,.7)', 1.6);
    for (let u = -0.9; u <= 0.91; u += 0.15) {
      const o = v3.mul(ct, u * S);
      P3(V, v3.add(o, v3.mul(bt, S)), v3.add(o, v3.mul(bt, -S)), 'rgba(200,215,240,.85)', 1.4);
    }
    /* Winkel α */
    const arc = [];
    for (let i = 0; i <= 24; i++) { const t = i / 24 * a; arc.push([0, 0.30 * Math.cos(t), 0.30 * Math.sin(t)]); }
    SEG3(V, arc, 'rgba(120,200,255,.8)', 1.5);
    P3(V, [0, 0, 0], [0, 0.46, 0], 'rgba(120,200,255,.35)', 1, [3, 4]);
    T3(V, [0, 0.42 * Math.cos(a / 2), 0.42 * Math.sin(a / 2)], 'α', '#8fd6ff', 13);
    T3(V, [0, -S - 0.22, 0], 'Gitter', 'rgba(220,230,255,.9)', 12);

    /* Drehgriff am Gitter */
    const knob = [0, 0.62 * cosa, 0.62 * sino];
    V._handleOrigin = V.proj([0, 0, 0]);
    V._handlePos = V.proj(knob);
    P3(V, [0, 0.30 * cosa, 0.30 * sino], knob, 'rgba(120,200,255,.4)', 1.2, [3, 4]);

    /* Zerlegung des E-Feldes am Gitter */
    const e0 = Eph(0);
    const mag = 0.42 + 0.40 * Math.abs(e0);
    const Ev = [0, (e0 >= 0 ? 1 : -1) * mag, 0];
    const parV = v3.mul(bt, v3.dot(Ev, bt));
    const perV = v3.sub(Ev, parV);
    A3(V, [0, 0, 0], Ev, 'rgba(233,238,251,.9)', 2.2, 9);
    A3(V, [0, 0, 0], parV, 'rgba(255,110,110,.6)', 2, 8);
    A3(V, [0, 0, 0], perV, 'rgba(255,180,80,.95)', 2.4, 10);
    T3(V, Ev, 'E_S', '#e9eefb', 12, -9);
    T3(V, perV, 'E⊥', '#ffb74d', 12, 13);
    T3(V, parV, 'E∥', 'rgba(255,150,150,.95)', 12, -10);

    /* Empfänger */
    [[-0.38, -0.035], [0.035, 0.38]].forEach(([u, v]) => {
      P3(V, [xr, u, 0], [xr, v, 0], 'rgba(120,140,175,.3)', 9);
      P3(V, [xr, u, 0], [xr, v, 0], '#c9d6ef', 3.4);
    });
    T3(V, [xr, 0.62, 0], 'Empfangsdipol', 'rgba(220,230,255,.9)', 12);
    const eR = Eph(xr) * sino;
    const tipE = [xr, ut[1] * eR * 0.40, ut[2] * eR * 0.40];
    A3(V, [xr, 0, 0], tipE, 'rgba(255,180,80,.95)', 2.2, 9);
    A3(V, [xr, 0, 0], [xr, tipE[1], 0], 'rgba(255,213,79,.95)', 2.4, 9);
    T3(V, [xr + 0.30, 0.34, 0], 'E⊥', '#ffb74d', 11.5, 0, 'left');
    T3(V, [xr - 0.06, -0.30, 0], 'E_E,∥', '#ffd54f', 11.5, 0, 'right');
    V.flush();

    /* Lämpchen */
    const A2 = V.proj([xr, 0, 0]);
    if (A2.z > 0.06) {
      const g2 = Math.pow(clamp(lampP, 0, 1), .34);
      if (g2 > .02) sGlow(c, A2.x, A2.y, 16 + 44 * g2, 'rgba(255,205,80,A)', Math.min(1, .3 + g2));
      c.beginPath(); c.arc(A2.x, A2.y, 7, 0, TAU);
      c.fillStyle = rgba(mixc([70, 70, 80], LAMPC, g2), 1); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1.2; c.stroke();
    }
    if (V._handlePos && V._handlePos.z > 0.06) drawKnob(V._handlePos);
  };
});

function taskCard(container, o) {
  const card = el('div', 'card');
  const h = el('h3'); h.append(el('span', 'n', o.n), el('span', null, o.title));
  card.append(h);
  if (o.text) card.append(el('p', null, o.text));
  const ans = el('div', 'ans'), fb = el('div', 'fb');
  let done = false;
  o.options.forEach((t, i) => {
    const b = el('button', null, t);
    b.onclick = () => {
      if (done) return; done = true;
      [...ans.children].forEach((x, j) => {
        if (j === o.correct) x.classList.add('ok');
        else if (j === i) x.classList.add('bad');
        x.disabled = true;
      });
      fb.textContent = o.feedback;
      if (i !== o.correct) fb.className = 'fb err';
      if (o.preset) {
        const jb = el('button', 'jump', '▶ In der Simulation zeigen');
        jb.onclick = () => { recvView.applyPreset(o.preset); showView(recvView); };
        card.append(jb);
      }
    };
    ans.append(b);
  });
  card.append(ans, fb);
  container.append(card);
}

/* ---------- Momentaner Energiefluss S = E × B ---------- */
function quiverS(V, st, lam, k, t, ext) {
  const ctx = V.ctx;
  const sref = 2 * Math.pow(k, 4) / (lam * lam);
  const NR = 9, NA = 24, rmax = ext * 0.97, rmin = clamp(0.24 * ext, 0.12, 0.5);
  for (let i = 0; i < NR; i++) {
    const r = rmin * Math.pow(rmax / rmin, i / (NR - 1));
    const na = i < 2 ? 8 : (i < 4 ? 16 : 24);
    const Lmax = Math.min(0.17 * r + 0.02 * ext, ext * 0.10);
    for (let j = 0; j < na; j++) {
      const th = j * TAU / na;
      const x = r * Math.sin(th), y = r * Math.cos(th);
      const f = dipoleField(x, y, 0, t, k);
      const S = v3.cross(f.E, f.B);
      const mag = v3.len(S); if (mag < 1e-15) continue;
      const len = Lmax * ampScale(mag, sref);
      const u = v3.mul(S, 1 / mag);
      const A = V.proj([x - u[0] * len * .5, y - u[1] * len * .5, 0]);
      const B = V.proj([x + u[0] * len * .5, y + u[1] * len * .5, 0]);
      if (A.z < 0.06 || B.z < 0.06) continue;
      const scr = Math.hypot(A.x - B.x, A.y - B.y);
      if (scr < 2.2) continue;
      const outward = u[0] * x + u[1] * y > 0;
      const col = outward ? 'rgba(67,209,122,.85)' : 'rgba(255,95,160,.85)';
      V.push((A.z + B.z) * .5, () => sArrow(ctx, A, B, col, Math.max(1.1, scr * .07), Math.min(6.5, 1.5 + scr * .45)));
    }
  }
}

/* ---------- Wellenfronten (Kugelschalen, die nach außen laufen) ---------- */
function waveFronts(V, lam, phase, ext) {
  const base = (((phase / TAU) % 1) + 1) % 1;
  for (let n = 0; n < 9; n++) {
    const R = (base + n) * lam;
    if (R > ext * 1.18) break;
    const a = 0.34 * (1 - n / 10);
    if (a < 0.05) continue;
    const col = 'rgba(120,190,255,' + a.toFixed(2) + ')';
    for (let w = 0; w < 2; w++) {
      const pts = [];
      for (let i = 0; i <= 64; i++) {
        const q = i / 64 * TAU, s = Math.sin(q) * R, c2 = Math.cos(q) * R;
        pts.push(w === 0 ? [s, c2, 0] : [s, 0, c2]);
      }
      for (let i = 0; i + 1 < pts.length; i++) P3(V, pts[i], pts[i + 1], col, 1.3);
    }
  }
}

/* ---------- Gemeinsames Gerüst für Nahfeld / Fernfeld ---------- */
function fieldChapter(id, title, opts) {
  return addView(id, title, V => {
    V.cam.yaw = 0.42; V.cam.pitch = 0.22;
    V.homeCam = { yaw: 0.42, pitch: 0.22, dist: 9 };
    const st = {
      f: F0, slow: .8, cut: 'vertical', showE: true, showB: opts.showB !== false, showNear: !!opts.showNear,
      showDonut: false, showCharges: true, showFieldArrows: true, showS: !!opts.showS,
      showFronts: !!opts.showFronts, showEqGrid: opts.showEqGrid !== false,
      phase: 0, autoFit: true, showGenerator: true,
      gridOn: false, gridA: 45, extFixed: opts.extFixed || 0,
      receiver: { r: opts.r0, theta: opts.theta0 || 90, phi: 35, beta: 0, mode: 'probe', gamma: 0 }
    };
    const G = grid(V.panel);
    const H = {};
    slider(G, {
      label: 'Frequenz des Senders', min: 60, max: 200, step: 1, value: 100,
      fmt: v => num(v, 0) + ' MHz', on: v => st.f = v * 1e6
    });
    H.r = slider(G, {
      label: 'Abstand des Messpunkts r', min: opts.rMin, max: opts.rMax, step: opts.rStep,
      value: opts.r0, fmt: v => num(v, v < 1 ? 2 : 1) + ' m', on: v => st.receiver.r = v
    });
    H.theta = slider(G, {
      label: 'Höhenwinkel θ (0° = Dipolachse)', min: 0, max: 90, step: 1, value: opts.theta0 || 90,
      fmt: v => num(v, 0) + '°', on: v => st.receiver.theta = v
    });
    seg(G, { label: 'E-Feld', value: 1, options: [{ v: 1, label: 'an' }, { v: 0, label: 'aus' }], on: v => st.showE = !!v });
    seg(G, { label: 'B-Feld', value: opts.showB === false ? 0 : 1, options: [{ v: 1, label: 'an' }, { v: 0, label: 'aus' }], on: v => st.showB = !!v });
    seg(G, {
      label: 'Energiefluss S = E × B', value: opts.showS ? 1 : 0,
      options: [{ v: 1, label: 'an' }, { v: 0, label: 'aus' }], on: v => st.showS = !!v
    });
    seg(G, {
      label: 'Wellenfronten', value: opts.showFronts ? 1 : 0,
      options: [{ v: 1, label: 'an' }, { v: 0, label: 'aus' }], on: v => st.showFronts = !!v
    });
    seg(G, {
      label: 'Nahfeldgrenze r = λ', value: opts.showNear ? 1 : 0,
      options: [{ v: 1, label: 'an' }, { v: 0, label: 'aus' }], on: v => st.showNear = !!v
    });
    slider(G, { label: 'Zeitlupe', min: .15, max: 2.5, step: .05, value: .8, fmt: v => num(v, 2) + ' Hz', on: v => st.slow = v });
    const bRow = el('div', 'ctrl');
    const bFit = el('button', 'jump', 'Ansicht einpassen');
    bFit.onclick = () => { st.autoFit = true; V.resetCam(); };
    bRow.append(bFit); G.append(bRow);
    V.onZoom = () => { st.autoFit = false; };

    const RO = readouts(G);
    RO.add('lam', 'Wellenlänge λ');
    RO.add('rl', 'r / λ');
    RO.add('bereich', 'Bereich');
    RO.add('phase', 'Phasendifferenz E–B');
    RO.add('flux', 'Gleichrichtung des Energieflusses');
    RO.add('term', 'dominierender Term');
    const plots = el('div', 'plots'); G.append(plots);
    const cv1 = el('canvas'), cv2 = el('canvas');
    plots.append(cv1, cv2);
    (opts.notes || []).forEach(n => note(G, n));

    V.draw = dt => {
      const info = renderDipole(V, st, dt);
      drawLamp(V, st, info.res);
      const k = info.k, lam = info.lam;
      const r = st.receiver.r, rl = r / lam;
      const dphi = fieldPhaseDiff(r, k);
      const sint = Math.sin(st.receiver.theta * D2R);
      const dom = termDominance(r, k);
      RO.set('lam', num(lam, 2) + ' m');
      RO.set('rl', num(rl, 2));
      RO.set('bereich', rl < 1 ? 'Nahfeld (r < λ)' : 'Fernfeld (r > λ)');
      RO.set('phase', num(dphi, 0) + '°' + (dphi > 60 ? ' → nicht in Phase' : dphi < 15 ? ' → in Phase' : ''));
      RO.set('flux', pct(fluxRatio(r, sint, k)));
      RO.set('term', ['1/r³ (Nahfeld)', '1/r² (Induktion)', '1/r (Fernfeld)'][dom]);
      phasePlot(cv1, st.phase, dphi * D2R);
      phaseDiffPlot(cv2, k, lam, r);
      V.setBadges(['r = ' + num(r, 2) + ' m = ' + num(rl, 2) + ' λ · λ = ' + num(lam, 2) + ' m',
        rl < 1 ? 'noch Nahfeld' : 'Fernfeld: E ⊥ B und in Phase']);
    };
  });
}

/* ==================== 4 · Nahfeld ==================== */
fieldChapter('near', '4 · Nahfeld', {
  r0: 0.20, rMin: 0.08, rMax: 2.0, rStep: 0.01, theta0: 90,
  extFixed: 1.05, showNear: false, showS: true, showFronts: false, showB: false, showEqGrid: true,
  notes: [
    '<b>Nahfeld (r &lt; λ):</b> Unmittelbar am Dipol ist das Feld fast wie das Feld eines <b>ruhenden</b> Dipols – es „klebt“ am Stab. ' +
    'Es überwiegt der Anteil, der mit <b>1/r³</b> abfällt. Der radiale Feldanteil ist hier groß, die Feldpfeile zeigen nach innen/außen statt nur quer.',
    '<b>E und B sind hier nicht in Phase</b> (Phasendifferenz bis 90°, siehe Diagramm rechts). Die Energie <b>pendelt</b> zwischen Dipol und Feld hin und her – ' +
    'der Energiefluss zeigt abwechselnd nach außen und nach innen (grün = nach außen, rosa = nach innen), im Mittel wird <b>keine</b> Leistung abgestrahlt.',
    'Mit wachsendem Abstand geht das Nahfeld stetig in das <b>Fernfeld</b> über; als Faustregel gilt die Grenze bei etwa einer Wellenlänge. ' +
    'Der eigentliche Übergang liegt bei r ≈ λ/2π ≈ 0,16 λ – im Diagramm sieht man, wie die Phasendifferenz dort von 90° auf 0° umschlägt.'
  ]
});

/* ==================== 5 · Fernfeld ==================== */
fieldChapter('far', '5 · Fernfeld', {
  r0: 4.0, rMin: 0.4, rMax: 9, rStep: 0.1, theta0: 90,
  extFixed: 0, showNear: true, showS: true, showFronts: true, showB: true, showEqGrid: false,
  notes: [
    '<b>Fernfeld (r &gt; λ):</b> Hier überwiegt der mit <b>1/r</b> abfallende Anteil – das Feld hat sich vom Dipol <b>gelöst</b> und läuft als ' +
    'elektromagnetische Welle mit Lichtgeschwindigkeit nach außen (Wellenfronten). Die Amplitude nimmt mit 1/r ab, die Leistung mit 1/r².',
    '<b>E ⊥ B und in Phase:</b> Beide erreichen gleichzeitig Maximum und Minimum (Phasendifferenz ≈ 0°, siehe Diagramm). ' +
    'E steht senkrecht zur Ausbreitungsrichtung (transversal), im Bild ist das Feld daher rein quer – kein radialer Anteil mehr.',
    'Der <b>Energiefluss S = E × B</b> zeigt im Fernfeld dauerhaft nach außen (alle Pfeile grün): etwa die Hälfte des momentanen Flusses ist gleichgerichtet, ' +
    'das ist die abgestrahlte Leistung ∝ 1/r².'
  ]
});

/* ==================== 8 · Rechenaufgaben ==================== */
const EX = [
  {
    n: '1', title: 'Wellenlänge berechnen',
    text: 'Ein UKW-Sender sendet mit f = 100 MHz. Berechne die Wellenlänge λ.',
    unit: 'm', answer: 3, tol: 0.02,
    sol: 'λ = c / f = (3,00 · 10⁸ m/s) / (1,00 · 10⁸ Hz) = <b>3,00 m</b>'
  },
  {
    n: '2', title: 'Länge des λ/2-Dipols',
    text: 'Wie lang muss ein λ/2-Dipol für f = 100 MHz sein?',
    unit: 'm', answer: 1.5, tol: 0.02,
    sol: 'λ = 3,00 m → Dipollänge = λ/2 = <b>1,50 m</b> (genau der Dipol in dieser Simulation)'
  },
  {
    n: '3', title: 'Frequenz aus der Wellenlänge',
    text: 'Ein Sender arbeitet mit λ = 0,69 m. Welche Frequenz hat er?',
    unit: 'MHz', answer: 434, tol: 0.03,
    sol: 'f = c / λ = (3,00 · 10⁸ m/s) / 0,69 m = 4,35 · 10⁸ Hz ≈ <b>435 MHz</b>'
  },
  {
    n: '4', title: 'WLAN',
    text: 'WLAN sendet bei f = 2,4 GHz. Wie lang ist die Welle?',
    unit: 'cm', answer: 12.5, tol: 0.03,
    sol: 'λ = c / f = (3,00 · 10⁸) / (2,4 · 10⁹) m = 0,125 m = <b>12,5 cm</b>. Ein λ/2-Dipol wäre nur 6,25 cm lang.'
  },
  {
    n: '5', title: 'Abstandsgesetz',
    text: 'Bei r = 1,0 m zeigt das Lämpchen 100 % Helligkeit. Wie viel Prozent sind es bei r = 4,0 m?',
    unit: '%', answer: 6.25, tol: 0.05,
    sol: 'Die Leistung verteilt sich auf die Kugelfläche 4πr², also P ∝ 1/r². Vierfacher Abstand → 1/4² = 1/16 = <b>6,25 %</b>'
  },
  {
    n: '6', title: 'Polarisation am Gitter',
    text: 'Das Gitter steht unter α = 30° zur Schwingungsebene des E-Feldes. Wie groß ist das Empfangsfeld |E_E,∥| im Verhältnis zu |E_S|?',
    unit: '× E_S', answer: 0.25, tol: 0.03,
    sol: '|E_S,⊥| = |E_S| · sin 30° = 0,50 · |E_S|. Der Empfangsdipol nimmt davon wieder nur sin 30° auf:<br>|E_E,∥| = |E_S| · sin² 30° = 0,25 · |E_S|'
  },
  {
    n: '7', title: 'Gitter halb abdunkeln',
    text: 'Bei welchem Winkel α ist das Empfangsfeld genau halb so groß wie das Maximum?',
    unit: '°', answer: 45, tol: 0.02,
    sol: 'sin² α = 0,5 → sin α = 0,7071 → <b>α = 45°</b>. (Die Helligkeit ∝ |E|² ist dabei nur 25 % des Maximums – im Kapitel 6 nachprüfen!)'
  },
  {
    n: '8', title: 'Ab wann ist es Fernfeld?',
    text: 'Ein Sender strahlt bei f = 150 MHz. Ab welchem Abstand r ist man im Fernfeld (r > λ)?',
    unit: 'm', answer: 2, tol: 0.03,
    sol: 'λ = c / f = (3,00 · 10⁸) / (1,50 · 10⁸) m = 2,00 m → Fernfeld ab <b>r > 2,00 m</b>'
  },
  {
    n: '9', title: 'Leistungsdichte',
    text: 'Ein Sender strahlt P = 10 W gleichmäßig in alle Richtungen ab. Wie groß ist die Leistungsdichte in r = 5,0 m Abstand?',
    unit: 'W/m²', answer: 0.0318, tol: 0.05,
    sol: 'Die Leistung verteilt sich auf die Kugeloberfläche 4πr²:<br>S = P / (4πr²) = 10 W / (4π · 25 m²) = <b>0,032 W/m²</b>'
  }
];

addView('ex', '8 · Rechenaufgaben', V => {
  V.stage.remove();
  V.panel.classList.add('full');
  const cards = el('div', 'cards'); V.panel.append(cards);
  const intro = el('div', 'note');
  intro.innerHTML = '<b>Rechenaufgaben.</b> Wert eintragen (Komma oder Punkt) und prüfen – oder den Lösungsweg aufklappen. ' +
    'Alle Aufgaben lassen sich in den Kapiteln 3, 5 und 6 der Simulation nachprüfen. c = 3,00 · 10⁸ m/s.';
  cards.append(intro);

  EX.forEach(t => {
    const card = el('div', 'card');
    const h = el('h3'); h.append(el('span', 'n', t.n), el('span', null, t.title));
    card.append(h, el('p', null, t.text));
    const row = el('div', 'ex');
    const inp = el('input');
    inp.type = 'text'; inp.inputMode = 'decimal'; inp.autocomplete = 'off'; inp.placeholder = 'Wert';
    row.append(inp, el('span', 'unit', t.unit));
    card.append(row);
    const fb = el('div', 'fb');
    const sol = el('div', 'sol'); sol.innerHTML = '<b>Lösungsweg:</b> ' + t.sol;
    const brow = el('div', 'exrow');
    const ok = el('button', null, 'Prüfen');
    const show = el('button', 'ghost', 'Lösungsweg zeigen');
    brow.append(ok, show);
    card.append(brow, fb, sol);

    const check = () => {
      const raw = inp.value.replace(',', '.').replace(/[^0-9.eE+-]/g, '');
      const v = parseFloat(raw);
      if (!isFinite(v)) { fb.className = 'fb err'; fb.textContent = 'Bitte einen Zahlenwert eingeben.'; return; }
      const rel = Math.abs(v - t.answer) / Math.abs(t.answer);
      if (rel <= t.tol) { fb.className = 'fb'; fb.innerHTML = '✔ Richtig – ' + t.answer + ' ' + t.unit; }
      else { fb.className = 'fb err'; fb.innerHTML = '✘ Noch nicht richtig. Tipp: erst Formel umstellen, dann einsetzen.'; }
    };
    ok.onclick = check;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
    show.onclick = () => { sol.classList.toggle('on'); show.textContent = sol.classList.contains('on') ? 'Lösungsweg verbergen' : 'Lösungsweg zeigen'; };
    cards.append(card);
  });
});

/* =========================================================================
   Start: Ansichten beobachten, Deep-Link (#id) auswerten, Schleife starten
   ========================================================================= */
/* Tabs nach der Nummer im Titel sortieren (Reihenfolge der Definition ist egal) */
[...tabsEl.children]
  .map(b => ({ b, n: parseInt(b.textContent, 10) }))
  .sort((a, b) => (isNaN(a.n) ? 99 : a.n) - (isNaN(b.n) ? 99 : b.n))
  .forEach(x => tabsEl.append(x.b));

views.forEach(v => {
  if (v.stage.isConnected) {
    const ro = new ResizeObserver(() => v.resize());
    ro.observe(v.stage);
  }
});
window.addEventListener('resize', () => views.forEach(v => v.resize()));
const hStart = location.hash.replace('#', '');
showView(views.find(v => v.id === hStart) || views[0]);
window.addEventListener('hashchange', () => {
  const v = views.find(x => x.id === location.hash.replace('#', ''));
  if (v) showView(v);
});
requestAnimationFrame(frame);
